<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра - Амстор (Update System)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a202c;
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .bottom-nav {
            background-color: #2d3748;
            border-top: 1px solid #4a5568;
            height: 75px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            font-size: 0.9rem;
            color: #a0aec0;
        }

        .nav-item:hover {
            background-color: #4a5568;
            color: white;
        }

        .nav-item.active {
            background-color: #2b6cb0;
            color: white;
            font-weight: bold;
        }

        .stats-container {
            width: 100%;
            max-width: 400px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: #2d3748;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .time-card {
            grid-column: span 2;
            margin-bottom: 15px;
            border: 1px solid #4a5568;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel {
            background: #2d3748;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }

        .item-card {
            background: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-buy, .btn-action {
            background-color: #2b6cb0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .btn-buy:disabled, .btn-action:disabled {
            background-color: #4a5568;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .category-tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #a0aec0;
        }

        .category-tab.active {
            border-bottom-color: #2b6cb0;
            color: white;
            font-weight: bold;
        }

        input[type=range] {
            width: 100%;
            margin: 15px 0;
            cursor: pointer;
        }

        #incident-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #e53e3e;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 1100;
            display: none;
            text-align: center;
        }

        .death-screen {
            text-align: center;
            max-width: 320px;
            padding: 30px;
            background: #2d3748;
            border: 2px solid #e53e3e;
            border-radius: 15px;
        }

        /* Update Modal */
        #update-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .update-box {
            background: #2d3748;
            width: 90%;
            max-width: 350px;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #4a5568;
        }

        .progress-container {
            width: 100%;
            height: 44px;
            background: #1a202c;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: #2b6cb0;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-text {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
        }
    </style>
</head>
<body>

    <div id="incident-msg"></div>

    <div id="update-modal">
        <div class="update-box">
            <h2 class="text-xl font-bold mb-1">Доступно обновление!</h2>
            <p id="update-version-text" class="text-sm text-blue-400 mb-4">v1.1.1</p>
            
            <div class="bg-[#1a202c] rounded-lg p-3 mb-6 text-xs text-gray-300 space-y-2 max-h-48 overflow-y-auto" id="changelog-list">
                <p>• Механика штрафов за голод/жажду</p>
                <p>• Механика «Конфуза» (туалет)</p>
                <p>• Урон от переутомления</p>
                <p>• Выбор типа сна: Короткий или Полный</p>
            </div>

            <button id="update-btn" onclick="runUpdateLoading()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition-all">
                Загрузить файлы
            </button>

            <div id="loading-container" class="progress-container">
                <div id="load-bar" class="progress-bar"></div>
                <div id="load-percent" class="progress-text">0%</div>
            </div>
        </div>
    </div>

    <div id="game-container">
        <div id="display-area" class="w-full flex justify-center"></div>
    </div>

    <nav class="bottom-nav">
        <div id="tab-1" class="nav-item" onclick="switchTab(1)">Профиль</div>
        <div id="tab-2" class="nav-item" onclick="switchTab(2)">Работа</div>
        <div id="tab-3" class="nav-item" onclick="switchTab(3)">Магазин</div>
        <div id="tab-4" class="nav-item" onclick="switchTab(4)">Дом</div>
    </nav>

    <script>
        const GAME_VERSION = "1.1.1";

        const initialState = {
            day: 1,
            lastPlayedVersion: "0.0.0",
            stats: { health: 100, happiness: 80, hunger: 50, fatigue: 10, toilet: 0, water: 90 },
            money: 500,
            freeTimeMinutes: 16 * 60, 
            currentTab: 1,
            shopCategory: 'food',
            rentDueDate: 30,
            rentAmount: 12500
        };

        let gameState = {};

        const foodMenu = [
            { name: "Лапша б/п", price: 15, hunger: 15, toilet: 5, happiness: -5, time: 20 },
            { name: "Батон и кефир", price: 45, hunger: 30, toilet: 15, happiness: 2, time: 30 },
            { name: "Пельмени", price: 120, hunger: 55, toilet: 15, happiness: 10, time: 40 },
            { name: "Энергетик и сухарики", price: 70, hunger: 10, toilet: 20, happiness: 25, time: 15 },
            { name: "Курица-гриль", price: 210, hunger: 85, toilet: 20, happiness: 20, time: 50 }
        ];

        const drinkMenu = [
            { name: "Минералка (0.5л)", price: 12, water: 35, toilet: 15, happiness: 2, fatigue: 0 },
            { name: "Кофе", price: 25, water: 15, toilet: 25, happiness: 10, fatigue: -5 },
            { name: "Холодный чай", price: 32, water: 50, toilet: 20, happiness: 12, fatigue: 0 },
            { name: "Сладкая газировка", price: 40, water: 30, toilet: 25, happiness: 20, fatigue: 0 },
            { name: "Лимонад", price: 55, water: 70, toilet: 35, happiness: 15, fatigue: 0 },
            { name: "Энергетик", price: 55, water: 20, toilet: 30, happiness: 25, fatigue: -15 }
        ];

        function checkUpdate() {
            if (gameState.lastPlayedVersion !== GAME_VERSION) {
                document.getElementById('update-modal').style.display = 'flex';
                document.getElementById('update-version-text').innerText = `v${GAME_VERSION}`;
            }
        }

        function runUpdateLoading() {
            const btn = document.getElementById('update-btn');
            const container = document.getElementById('loading-container');
            const bar = document.getElementById('load-bar');
            const percent = document.getElementById('load-percent');

            btn.style.display = 'none';
            container.style.display = 'block';

            let progress = 0;
            const duration = 6000;
            const step = 100 / (duration / 50);

            const timer = setInterval(() => {
                progress += step;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    gameState.lastPlayedVersion = GAME_VERSION;
                    saveGame();
                    setTimeout(() => {
                        document.getElementById('update-modal').style.display = 'none';
                    }, 500);
                }
                bar.style.width = progress + '%';
                percent.innerText = Math.floor(progress) + '%';
            }, 50);
        }

        function showMessage(text) {
            const msg = document.getElementById('incident-msg');
            msg.innerText = text;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
        }

        function saveGame() {
            localStorage.setItem('amstor_game_save', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('amstor_game_save');
            if (saved) {
                gameState = JSON.parse(saved);
            } else {
                gameState = { ...initialState };
            }
        }

        function applyDepletionPenalty() {
            if (gameState.stats.hunger <= 0 || gameState.stats.water <= 0) {
                gameState.stats.health = Math.max(0, gameState.stats.health - 1);
                return true;
            }
            return false;
        }

        function checkToiletIncident() {
            if (gameState.stats.toilet >= 100) {
                gameState.stats.toilet = 0;
                gameState.stats.happiness = Math.max(0, gameState.stats.happiness - 50);
                showMessage("Произошел «Конфуз»! Счастье -50%");
                return true;
            }
            return false;
        }

        function checkHealthStatus(deathType = "default") {
            if (gameState.stats.health <= 0 || deathType === "eviction") {
                const display = document.getElementById('display-area');
                let message = deathType === "eviction" ? '"У него не хватило денег на аренду..."' : '"Мир оказался слишком суров..."';
                let title = deathType === "eviction" ? "ВЫ ВЫСЕЛЕНЫ" : "ВЫ ПОГИБЛИ";
                display.innerHTML = `
                    <div class="death-screen">
                        <h1 class="text-2xl font-bold text-red-500 mb-4">${title}</h1>
                        <p class="text-sm text-gray-300 italic mb-6">${message}</p>
                        <button onclick="resetGame()" class="bg-white text-black font-bold py-2 px-6 rounded-full hover:bg-gray-200 transition">Заново</button>
                    </div>`;
                return true;
            }
            return false;
        }

        function resetGame() {
            localStorage.removeItem('amstor_game_save');
            location.reload();
        }

        function renderStats() {
            const h = Math.floor(gameState.freeTimeMinutes / 60);
            const m = gameState.freeTimeMinutes % 60;
            return `
                <div class="stats-container">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-semibold text-gray-300">Профиль</h2>
                        <span class="bg-blue-900 text-blue-200 text-xs px-3 py-1 rounded-full font-bold">ДЕНЬ ${gameState.day}</span>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card time-card">
                            <div><span class="stat-label">Свободное время</span><span class="stat-value text-blue-400 text-lg">${h} ч. ${m} мин.</span></div>
                            <div><span class="stat-label">Баланс</span><span class="stat-value text-yellow-500">${gameState.money} ₴</span></div>
                        </div>
                        <div class="stat-card"><span class="stat-label">Здоровье</span><span class="stat-value text-green-400">${gameState.stats.health}%</span></div>
                        <div class="stat-card"><span class="stat-label">Счастье</span><span class="stat-value text-yellow-400">${gameState.stats.happiness}%</span></div>
                        <div class="stat-card"><span class="stat-label">Сытость</span><span class="stat-value text-orange-400">${gameState.stats.hunger}%</span></div>
                        <div class="stat-card"><span class="stat-label">Усталость</span><span class="stat-value text-purple-400">${gameState.stats.fatigue}%</span></div>
                        <div class="stat-card"><span class="stat-label">Туалет</span><span class="stat-value text-amber-600">${gameState.stats.toilet}%</span></div>
                        <div class="stat-card"><span class="stat-label">Вода</span><span class="stat-value text-blue-400">${gameState.stats.water}%</span></div>
                    </div>
                </div>`;
        }

        function renderWork() {
            return `
                <div class="panel">
                    <h2 class="text-xl mb-4 text-center font-semibold text-gray-300">Работа</h2>
                    <input type="range" id="work-range" min="1" max="12" value="6" oninput="updateWorkInfo(this.value)">
                    <div class="bg-[#1a202c] rounded-lg p-4 mb-4 text-sm space-y-2">
                        <div class="flex justify-between text-green-400"><span>Зарплата:</span><span id="info-pay" class="font-bold">+360 ₴</span></div>
                        <div class="flex justify-between text-orange-400"><span>Голод:</span><span id="info-hunger" class="font-bold">-24%</span></div>
                        <div class="flex justify-between text-blue-400"><span>Жажда:</span><span id="info-water" class="font-bold">-42%</span></div>
                        <div class="flex justify-between text-purple-400"><span>Усталость:</span><span id="info-fatigue" class="font-bold">+48%</span></div>
                    </div>
                    <button id="work-btn" class="bg-green-700 w-full py-3 rounded-lg font-bold" onclick="handleWork()">Начать</button>
                </div>`;
        }

        function updateWorkInfo(val) {
            document.getElementById('info-pay').innerText = `+${val * 60} ₴`;
            document.getElementById('info-hunger').innerText = `-${val * 4}%`;
            document.getElementById('info-water').innerText = `-${val * 7}%`;
            document.getElementById('info-fatigue').innerText = `+${val * 8}%`;
            document.getElementById('work-btn').disabled = (val * 60) > gameState.freeTimeMinutes;
        }

        function handleWork() {
            const hours = parseInt(document.getElementById('work-range').value);
            const timeNeeded = hours * 60;
            if (timeNeeded > gameState.freeTimeMinutes) return;
            
            gameState.money += hours * 60;
            gameState.stats.fatigue = Math.min(100, gameState.stats.fatigue + (hours * 8));
            gameState.stats.hunger = Math.max(0, gameState.stats.hunger - (hours * 4));
            gameState.stats.water = Math.max(0, gameState.stats.water - (hours * 7));
            gameState.stats.toilet = Math.min(100, gameState.stats.toilet + (hours * 5));
            gameState.freeTimeMinutes -= timeNeeded;
            
            applyDepletionPenalty();
            checkToiletIncident();
            
            saveGame();
            if (!checkHealthStatus()) switchTab(1);
        }

        function renderShop() {
            let itemsHtml = '';
            let list = gameState.shopCategory === 'food' ? foodMenu : drinkMenu;
            list.forEach((item, index) => {
                const canAfford = gameState.money >= item.price;
                itemsHtml += `
                    <div class="item-card">
                        <div class="flex-1 text-xs"><div class="font-bold">${item.name}</div></div>
                        <button class="btn-buy" ${canAfford ? '' : 'disabled'} onclick="buyItem('${gameState.shopCategory}', ${index})">${item.price} ₴</button>
                    </div>`;
            });
            return `
                <div class="panel">
                    <div class="flex mb-4 border-b border-gray-600">
                        <div class="category-tab ${gameState.shopCategory === 'food' ? 'active' : ''}" onclick="setCategory('food')">Еда</div>
                        <div class="category-tab ${gameState.shopCategory === 'drinks' ? 'active' : ''}" onclick="setCategory('drinks')">Вода</div>
                    </div>
                    <div class="max-h-64 overflow-y-auto">${itemsHtml}</div>
                </div>`;
        }

        function setCategory(cat) { gameState.shopCategory = cat; switchTab(3); }

        function buyItem(type, index) {
            const item = type === 'food' ? foodMenu[index] : drinkMenu[index];
            if (gameState.money < item.price) return;
            
            gameState.money -= item.price;
            if (type === 'food') {
                gameState.stats.hunger = Math.min(100, gameState.stats.hunger + item.hunger);
                gameState.stats.happiness = Math.min(100, gameState.stats.happiness + item.happiness);
            } else {
                gameState.stats.water = Math.min(100, gameState.stats.water + item.water);
            }
            gameState.stats.toilet = Math.min(100, gameState.stats.toilet + item.toilet);
            
            applyDepletionPenalty();
            checkToiletIncident();
            
            saveGame();
            switchTab(3);
        }

        function renderHome() {
            const daysLeft = gameState.rentDueDate - gameState.day;
            return `
                <div class="panel">
                    <h2 class="text-xl mb-4 text-center font-semibold text-gray-300">Дом</h2>
                    <div class="bg-[#1a202c] border border-blue-500/30 rounded-lg p-3 mb-4 text-xs">
                        <div class="flex justify-between text-blue-300 mb-1"><span>Аренда:</span><span class="font-bold">${gameState.rentAmount} ₴</span></div>
                        <div class="flex justify-between text-gray-400"><span>До оплаты:</span><span>${daysLeft} дн.</span></div>
                    </div>
                    <div class="space-y-3">
                        <div class="item-card">
                            <div class="flex-1">
                                <div class="text-sm font-bold">Туалет (20 мин.)</div>
                                <div class="text-[10px] text-gray-400">Сброс шкалы нужды</div>
                            </div>
                            <button class="btn-action" onclick="goToilet()">Идти</button>
                        </div>
                        <div class="bg-gray-800 p-3 rounded-lg">
                            <p class="text-center text-xs text-blue-300 font-bold mb-3 uppercase tracking-wider">Сон</p>
                            <div class="flex gap-2">
                                <button class="flex-1 bg-indigo-800 hover:bg-indigo-700 text-[10px] py-3 rounded-md font-bold" onclick="goToSleep(4)">
                                    КОРОТКИЙ<br>(4ч, -40% уст)
                                </button>
                                <button class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-[10px] py-3 rounded-md font-bold" onclick="goToSleep(8)">
                                    ПОЛНЫЙ<br>(8ч, -100% уст)
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function goToilet() {
            if (gameState.freeTimeMinutes < 20) return;
            gameState.freeTimeMinutes -= 20;
            gameState.stats.toilet = 0;
            saveGame();
            switchTab(4);
        }

        function goToSleep(type) {
            // Урон от переутомления перед сном
            if (gameState.stats.fatigue >= 100) {
                gameState.stats.health = Math.max(0, gameState.stats.health - 5);
                showMessage("Урон от переутомления -5% ХП");
            }

            gameState.day += 1;
            gameState.freeTimeMinutes = 16 * 60;
            
            // Расход статов за ночь
            gameState.stats.hunger = Math.max(0, gameState.stats.hunger - 20);
            gameState.stats.water = Math.max(0, gameState.stats.water - 25);

            if (type === 4) {
                gameState.stats.fatigue = Math.max(0, gameState.stats.fatigue - 40);
            } else {
                gameState.stats.fatigue = 0;
                gameState.stats.happiness = Math.min(100, gameState.stats.happiness + 10);
            }

            // Проверка аренды
            if (gameState.day > gameState.rentDueDate) {
                if (gameState.money >= gameState.rentAmount) {
                    gameState.money -= gameState.rentAmount;
                    gameState.rentDueDate += 30;
                } else {
                    if (checkHealthStatus("eviction")) return;
                }
            }

            saveGame();
            if (!checkHealthStatus()) switchTab(1);
        }

        function switchTab(id) {
            gameState.currentTab = id;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            const tabBtn = document.getElementById(`tab-${id}`);
            if (tabBtn) tabBtn.classList.add('active');
            
            const display = document.getElementById('display-area');
            if (id === 1) display.innerHTML = renderStats();
            else if (id === 2) { display.innerHTML = renderWork(); updateWorkInfo(6); }
            else if (id === 3) display.innerHTML = renderShop();
            else if (id === 4) display.innerHTML = renderHome();
        }

        window.onload = () => {
            loadGame();
            checkUpdate();
            switchTab(1);
        };
    </script>
</body>
</html>
